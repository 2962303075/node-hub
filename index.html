<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>QQ农场助手节点入口</title>
  <link rel="stylesheet" href="./style.css?v=20261122-1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="QQFarm Bot">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="6" rx="2"></rect>
          <rect x="3" y="14" width="18" height="6" rx="2"></rect>
          <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
        </svg>
      </span>
      <span>QQ农场助手</span>
    </a>
  </header>

  <main class="page">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><span class="eyebrow-dot"></span> QQ 农场助手 · 节点入口</div>
        <h1>一键进入你的农场</h1>
        <p>输入用户名或卡密，系统会优先打开账号已添加的节点，没有记录时自动选择当前最佳节点。</p>
      </div>
      <div class="hero-panel">
        <form id="accessForm" class="access-form" autocomplete="off">
          <label class="access-field" for="accessIdentifier">
            <span id="identifierLabel">用户名或卡密</span>
            <input id="accessIdentifier" name="identifier" type="text" inputmode="text" autocomplete="off" placeholder="请输入用户名或卡密" required>
          </label>
          <div class="captcha-row">
            <label class="access-field captcha-answer" for="captchaAnswer">
              <span id="captchaQuestion">图片数字</span>
              <img id="captchaImage" class="captcha-image" alt="4位数字验证码" width="220" height="72">
              <input id="captchaAnswer" name="captchaAnswer" type="text" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9０-９]{4}" placeholder="输入4位数字" required>
            </label>
            <button id="refreshCaptcha" class="captcha-refresh" type="button" title="刷新验证" aria-label="刷新验证">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M21 12a9 9 0 0 1-15.5 6.2L3 15"></path>
                <path d="M3 21v-6h6"></path>
                <path d="M3 12A9 9 0 0 1 18.5 5.8L21 9"></path>
                <path d="M21 3v6h-6"></path>
              </svg>
            </button>
          </div>
          <button id="bestNodeAction" class="best-node-action" type="submit">
            验证并打开最佳节点
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8"></path>
            </svg>
          </button>
          <div id="accessStatus" class="access-status" role="status" aria-live="polite"></div>
          <p class="access-rule">已有账号节点优先 · 没有记录则自动匹配最佳节点</p>
        </form>
      </div>
    </section>

    <section class="nodes-section" aria-labelledby="nodesTitle">
      <div class="nodes-heading">
        <div>
          <div class="eyebrow"><span class="eyebrow-dot"></span> 实时节点</div>
          <h2 id="nodesTitle">当前可用节点</h2>
        </div>
        <span id="nodesUpdated" class="nodes-updated">正在获取状态…</span>
      </div>
      <div id="nodesStatus" class="nodes-status" role="status" aria-live="polite"></div>
      <div id="nodesList" class="nodes-list" aria-live="polite"></div>
    </section>

    <p style="text-align:center;color:rgba(255,255,255,.35);font-size:11px;margin:18px 0 0">build-20261122-1</p>
  </main>

  <script src="./portal.config.js?v=20261122-1"></script>
  <script src="./script.js?v=20261122-1"></script>
</body>
</html>
