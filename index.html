<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QQ农场智能助手 · 节点选择</title>
<meta name="theme-color" content="#2f8f5b" />
<style>
  :root {
    --bg: #f4f8f5;
    --card: #ffffff;
    --ink: #1e2d25;
    --muted: #6b7d74;
    --line: #e2ebe5;
    --primary: #2f8f5b;
    --primary-dark: #247147;
    --soft: #eaf5ef;
    --ok: #22a95f;
    --warn: #d88a1e;
    --off: #a8b6ae;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131a16;
      --card: #1b2420;
      --ink: #e8f0ea;
      --muted: #93a59b;
      --line: #2a3730;
      --soft: #223028;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(47,143,91,.14), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 32px 18px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .head { text-align: center; margin-bottom: 28px; }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), #2b7f8f);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(47,143,91,.28);
  }
  .logo svg { width: 30px; height: 30px; }
  h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; }
  .nodes { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
  .node {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    box-shadow: 0 2px 10px rgba(30,45,37,.04);
    text-decoration: none;
    color: inherit;
  }
  .node:active { transform: scale(.985); }
  @media (hover: hover) {
    .node:hover { border-color: var(--primary); box-shadow: 0 10px 26px rgba(47,143,91,.14); transform: translateY(-2px); }
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--off);
    flex: none;
    box-shadow: 0 0 0 4px rgba(168,182,174,.18);
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(34,169,95,.18); }
  .dot.busy { background: var(--warn); box-shadow: 0 0 0 4px rgba(216,138,30,.18); }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 5px;
    background: var(--soft); color: var(--primary);
  }
  .info { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .arrow { color: var(--muted); flex: none; }
  .foot {
    margin-top: 30px; text-align: center; color: var(--muted);
    font-size: 12px; line-height: 1.9; max-width: 440px;
  }
  .foot a { color: var(--primary); text-decoration: none; }
  .refresh {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .refresh:active { transform: scale(.97); }
  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.8V20h14V9.8" />
        <path d="M9.5 20v-5.5h5V20" />
      </svg>
    </div>
    <h1>QQ农场智能助手</h1>
    <div class="sub">请选择一条线路进入</div>
  </div>

  <div class="nodes" id="nodes"></div>

  <div style="text-align:center">
    <button class="refresh" id="refresh">
      <span id="refreshIcon">⟳</span> 刷新线路状态
    </button>
  </div>

  <div class="foot">
    线路状态每 30 秒自动刷新 · 点击线路即可进入<br>
    如遇无法打开，请尝试切换其他线路
  </div>

<script>
(function () {
  // 节点配置：修改这里即可增删线路
  var NODES = [
    {
      name: '线路一',
      badge: '推荐',
      label: '标准线路',
      probe: 'https://qq.29sml.cn/api/public/stats',
      url: 'https://qq.29sml.cn'
    },
    {
      name: '线路二',
      badge: '直连',
      label: '备用线路（IP 直连）',
      probe: null,
      url: 'http://36.137.25.32:88'
    }
  ];

  var box = document.getElementById('nodes');
  var icon = document.getElementById('refreshIcon');

  function render() {
    box.innerHTML = NODES.map(function (n) {
      return (
        '<a class="node" href="' + n.url + '">' +
          '<span class="dot" data-probe="' + n.probe + '"></span>' +
          '<span class="meta">' +
            '<span class="name">' + n.name +
              (n.badge ? '<span class="badge">' + n.badge + '</span>' : '') +
            '</span>' +
            '<span class="info" data-info="' + n.probe + '">' + n.label + ' · 检测中…</span>' +
          '</span>' +
          '<span class="arrow">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>' +
          '</span>' +
        '</a>'
      );
    }).join('');
  }

  function probeAll() {
    NODES.forEach(function (n) {
      var dot = box.querySelector('.dot[data-probe="' + n.probe + '"]');
      var info = box.querySelector('.info[data-info="' + n.probe + '"]');
      if (!dot || !info) return;
      if (!n.probe) {
        dot.className = 'dot';
        info.textContent = n.label;
        return;
      }
      dot.className = 'dot busy';
      info.textContent = n.label + ' · 检测中…';

      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 6000);

      fetch(n.probe, { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          clearTimeout(timer);
          var data = (d && d.data) || {};
          if (d && d.ok && typeof data.online === 'number') {
            dot.className = 'dot on';
            info.textContent = (data.nodeName || n.label) + ' · 在线 ' + data.online + '/' + (data.accounts || 0);
          } else {
            dot.className = 'dot';
            info.textContent = n.label + ' · 状态未知';
          }
        })
        .catch(function () {
          clearTimeout(timer);
          dot.className = 'dot';
          info.textContent = n.label + ' · 无法连接';
        });
    });
  }

  document.getElementById('refresh').addEventListener('click', function () {
    icon.classList.add('spin');
    probeAll();
    setTimeout(function () { icon.classList.remove('spin'); }, 1200);
  });

  render();
  probeAll();
  setInterval(probeAll, 30000);
})();
</script>
</body>
</html>
